name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.pandadesign.hu"
          for attempt in {1..18}; do
            if html="$(curl -fsSL --max-time 20 "$base/" 2>/dev/null)" &&
               grep -Fq "Ügyfélszerző weboldalak magyar vállalkozásoknak" <<<"$html"; then
              echo "Production is serving the expected release."
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/18)..."
            sleep 10
          done

          echo "::group::Production diagnostics"
          echo "DNS www:"
          dig +short www.pandadesign.hu || true
          echo "DNS apex:"
          dig +short pandadesign.hu || true

          curl -sS -L --max-time 20             -D /tmp/pandadesign-headers.txt             -o /tmp/pandadesign-home.html             -w "HTTP %{http_code}\nEffective URL: %{url_effective}\n"             "$base/" || true

          echo "--- Response headers ---"
          cat /tmp/pandadesign-headers.txt || true

          echo "--- Page title ---"
          grep -oE '<title>[^<]*</title>' /tmp/pandadesign-home.html | head -n 1 || true

          if grep -Fq "Weboldalak, amelyek ügyfeleket hoznak" /tmp/pandadesign-home.html; then
            echo "::error::The custom domain is still serving the legacy PandaDesign homepage."
          elif grep -Fq "Ügyfélszerző weboldalak magyar vállalkozásoknak" /tmp/pandadesign-home.html; then
            echo "Expected homepage marker found during diagnostics."
          else
            echo "::error::The custom domain returned an unexpected homepage version."
          fi

          echo "--- HTML markers ---"
          grep -oE 'Ügyfélszerző weboldalak magyar vállalkozásoknak|Weboldalak, amelyek ügyfeleket hoznak|Ingyenes weboldal-audit|Ajánlatot kérek' /tmp/pandadesign-home.html | sort -u || true
          echo "::endgroup::"

          echo "::error::Production did not serve the expected homepage within the retry window."
          exit 1

      - name: Check critical public routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.pandadesign.hu"
          for path in "/" "/kapcsolat" "/ingyenes-weboldal-audit" "/arak" "/referenciak" "/blog"; do
            code="$(curl -sSL -o /dev/null --max-time 20 -w "%{http_code}" "$base$path")"
            echo "$path -> $code"
            test "$code" = "200"
          done

      - name: Check SEO and social metadata
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsSL --max-time 20 https://www.pandadesign.hu/)"
          grep -Fq 'rel="canonical"' <<<"$html"
          grep -Fq 'https://www.pandadesign.hu/' <<<"$html"
          grep -Fq 'og:image' <<<"$html"
          grep -Fq 'twitter:image' <<<"$html"
          grep -Fq 'Ingyenes weboldal-audit' <<<"$html"
          grep -Fq 'Ajánlatot kérek' <<<"$html"

      - name: Check compiled GA4 configuration
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.pandadesign.hu"
          html="$(curl -fsSL --max-time 20 "$base/")"
          printf '%s' "$html" > /tmp/pandadesign-home.html

          mapfile -t scripts < <(
            grep -oE 'src="[^"]+\.js[^"]*"' /tmp/pandadesign-home.html               | sed -E 's/^src="//; s/"$//'               | sort -u
          )

          : > /tmp/pandadesign-js.txt
          for src in "${scripts[@]}"; do
            if [[ "$src" == http* ]]; then
              url="$src"
            else
              url="$base${src}"
            fi
            curl -fsSL --max-time 20 "$url" >> /tmp/pandadesign-js.txt || true
            printf '\n' >> /tmp/pandadesign-js.txt
          done

          ga_ids="$(
            {
              cat /tmp/pandadesign-home.html
              cat /tmp/pandadesign-js.txt
            } | grep -aoE 'G-[A-Z0-9]{6,}' | sort -u || true
          )"

          if [[ -z "$ga_ids" ]]; then
            echo "::warning::No GA4 Measurement ID was found in the compiled production assets."
          else
            echo "Compiled GA4 Measurement ID(s):"
            echo "$ga_ids"
          fi

      - name: Check production-only protections
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.pandadesign.hu"

          test_code="$(curl -sSL -o /dev/null --max-time 20 -w "%{http_code}" "$base/supabase-test")"
          echo "/supabase-test -> $test_code"
          test "$test_code" = "404"

          admin_headers="$(curl -sS -D - -o /dev/null --max-time 20 "$base/admin")"
          grep -Eiq '^x-robots-tag:.*noindex' <<<"$admin_headers"

      - name: Report apex redirect
        shell: bash
        run: |
          set -euo pipefail
          effective="$(curl -sSL -o /dev/null --max-time 20 -w "%{url_effective}" https://pandadesign.hu/)"
          echo "Apex effective URL: $effective"
          if [[ "$effective" != https://www.pandadesign.hu/* ]]; then
            echo "::warning::Apex domain does not currently resolve to the canonical www host."
          fi
